name: Docker Eclipse Temurin CI
on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 4"

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - JAVA: 8
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le
            TYPE: jre
            DIR: debian/trixie
          - JAVA: 8
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le
            TYPE: jdk
            DIR: debian/trixie

          - JAVA: 11
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/s390x
            TYPE: jre
            DIR: debian/trixie
          - JAVA: 11
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/s390x
            TYPE: jdk
            DIR: debian/trixie

          - JAVA: 17
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
            TYPE: jre
            DIR: debian/trixie
          - JAVA: 17
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
            TYPE: jdk
            DIR: debian/trixie

          - JAVA: 21
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
            TYPE: jre
            DIR: debian/trixie
          - JAVA: 21
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
            TYPE: jdk
            DIR: debian/trixie

          - JAVA: 25
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
            TYPE: jre
            DIR: debian/trixie
          - JAVA: 25
            PLATFORMS: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
            TYPE: jdk
            DIR: debian/trixie

    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: dph5199278/eclipse-temurin
      DOCKERFILE_CONTEXT: ./${{ matrix.JAVA }}/${{ matrix.TYPE }}/${{ matrix.DIR }}
      JAVA_VERSION: ${{ matrix.JAVA }}
      JAVA_PLATFORMS: ${{ matrix.PLATFORMS }}
      JAVA_TYPE: ${{ matrix.TYPE }}
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract and clean Dockerfile JAVA_VERSION
        id: java_clean
        run: |
          RAW_VERSION=$(grep -E '^ENV JAVA_VERSION=' ${{ env.DOCKERFILE_CONTEXT }}/Dockerfile | head -1 | cut -d '=' -f2- | sed 's/^"//;s/"$//')
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: ENV JAVA_VERSION not found in Dockerfile"
            exit 1
          fi
          echo "Raw version: $RAW_VERSION"

          # Clean: remove jdk- or jdk prefix, replace + with _
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed -E 's/^jdk-?//; s/\+/_/')
          echo "Cleaned version: $CLEAN_VERSION"

          # Set output (GitHub Actions new syntax)
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - if: ${{ success() }}
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - if: ${{ success() }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - if: ${{ success() }}
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: ${{ success() }}
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKERFILE_CONTEXT }}
          push: true
          platforms: ${{ env.JAVA_PLATFORMS }}
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.JAVA_VERSION }}-${{ env.JAVA_TYPE }}
            ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.java_clean.outputs.clean_version }}-${{ env.JAVA_TYPE }}
